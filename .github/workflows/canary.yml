name: Canary

on:
  schedule:
    # 07:37 JST, after gaato/moonbit-docker rebuilds the latest and nightly images.
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    uses: gaato/.github/.github/workflows/moonbit-canary.yml@main
    with:
      gates: scripts/gates.sh
